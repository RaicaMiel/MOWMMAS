<!--
  Topbar — repeated on every admin page. Place it as the first child of
  <div class="mw-app__body">. The only line that changes per page is the last
  breadcrumb item (<li class="mw-breadcrumb__current" aria-current="page">),
  which holds the current page name. This copy shows the dashboard.
-->
<header class="mw-topbar">
  <button class="mw-icon-btn mw-topbar__menu" type="button" data-drawer-toggle aria-controls="sidebar" aria-expanded="false" aria-label="Open menu" hidden>
    <svg class="mw-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
  </button>
  <nav class="mw-breadcrumb" aria-label="Breadcrumb">
    <ol class="mw-breadcrumb__list">
      <li><a class="mw-breadcrumb__link" href="dashboard.html">Admin workspace</a></li>
      <li class="mw-breadcrumb__current" aria-current="page">Dashboard</li>
    </ol>
  </nav>
  <div class="mw-topbar__actions">
    <a class="mw-icon-btn mw-icon-btn--outline" href="sms-notifications.html" aria-label="Notifications">
      <svg class="mw-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </a>
  </div>
</header>
